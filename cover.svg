<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10180d"/>
      <stop offset="100%" stop-color="#1c2715"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8ed158"/>
      <stop offset="100%" stop-color="#5a9e2f"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" fill="url(#bg)"/>
  <rect x="8" y="8" width="984" height="544" rx="18" fill="none" stroke="#2e3d22" stroke-width="2"/>

  <!-- fabric motif: two spines over three leaves, meshed -->
  <g stroke="#3b5a26" stroke-width="2.5">
    <line x1="340" y1="150" x2="250" y2="300"/><line x1="340" y1="150" x2="500" y2="300"/><line x1="340" y1="150" x2="750" y2="300"/>
    <line x1="660" y1="150" x2="250" y2="300"/><line x1="660" y1="150" x2="500" y2="300"/><line x1="660" y1="150" x2="750" y2="300"/>
    <line x1="250" y1="300" x2="250" y2="420"/><line x1="500" y1="300" x2="500" y2="420"/><line x1="750" y1="300" x2="750" y2="420"/>
  </g>

  <!-- spine nodes -->
  <g fill="#1c2715" stroke="url(#accent)" stroke-width="3">
    <rect x="300" y="122" width="80" height="56" rx="9"/>
    <rect x="620" y="122" width="80" height="56" rx="9"/>
  </g>
  <!-- leaf nodes -->
  <g fill="#1c2715" stroke="#8ed158" stroke-width="3">
    <rect x="212" y="272" width="76" height="56" rx="9"/>
    <rect x="462" y="272" width="76" height="56" rx="9"/>
    <rect x="712" y="272" width="76" height="56" rx="9"/>
  </g>
  <!-- host nodes -->
  <g fill="#8ed158">
    <circle cx="250" cy="420" r="11"/><circle cx="500" cy="420" r="11"/><circle cx="750" cy="420" r="11"/>
  </g>

  <!-- little ">_" container glyphs inside spines -->
  <g fill="#8ed158" font-size="22" font-weight="700">
    <text x="330" y="158">&gt;_</text>
    <text x="650" y="158">&gt;_</text>
  </g>

  <text x="500" y="500" text-anchor="middle" fill="#e3efd5" font-size="44" font-weight="700" letter-spacing="1">Concise ContainerLab</text>
  <text x="500" y="532" text-anchor="middle" fill="#a9bd92" font-size="19">Network labs as code · FRR &amp; Linux</text>
</svg>
